[project]
name = "conformal-thesis"
version = "0.1.0"
description = "等角予測による分布によらない予測区間（卒業研究）"
requires-python = ">=3.11"
# 下限は「実際に検証した最も古い環境」に合わせてある（手元の Anaconda）。
# 上げると手元で動かなくなるので、上げる前に必ず make test を通すこと。
# 提出時は付録Bに「実際に使ったバージョン」を pip freeze から転記する。
dependencies = [
    "numpy>=1.26.4",
    "scipy>=1.15.3",
    "scikit-learn>=1.3.0",
    "pandas>=1.5.3",
    "matplotlib>=3.7.1",
]

[project.optional-dependencies]
# 上限は必須。MAPIE 1.x は scikit-learn>=1.4 を要求し、手元の 1.3.0 が
# アップグレードされる。それは rf/gbm/mlp の学習結果を変え、results/*.csv が
# 再現しなくなる（CLAUDE.md 再現性ルール違反）。上限を外す場合は
# 全実験を回し直して結果を差し替えること。
dev = ["pytest>=7.4.0", "mapie>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
